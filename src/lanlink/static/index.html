<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LanLink</title>
  <style>
    body { background:#f7f8fc; color:#1d2433; font:16px system-ui,sans-serif; margin:0 auto; max-width:720px; padding:24px; }
    h1 { margin-bottom:4px; } .card { background:#fff; border:1px solid #dfe4ef; border-radius:12px; margin:14px 0; padding:16px; }
    input,button { border:1px solid #b9c2d5; border-radius:7px; font:inherit; padding:9px; } input { max-width:155px; } button { background:#2457d6; color:#fff; cursor:pointer; }
    li { align-items:center; border-bottom:1px solid #edf0f5; display:flex; gap:8px; padding:11px 0; } li:last-child { border:0; }
    .name { flex:1; overflow-wrap:anywhere; } .muted { color:#65718a; font-size:.9em; } .error { color:#b42318; } #browser { display:none; }
  </style>
</head>
<body>
  <h1>LanLink</h1><p class="muted">Private local sharing — pair this device before browsing.</p>
  <section id="pair" class="card">
    <label>This device's name<br><input id="name" value="My phone"></label>
    <label>Code from the LanLink computer<br><input id="code" inputmode="numeric" maxlength="6" placeholder="123456"></label>
    <button id="pairButton">Pair and open folders</button><p id="pairError" class="error"></p>
  </section>
  <section id="browser" class="card">
    <div><button id="back">← Back</button> <strong id="title">Folders</strong></div>
    <ul id="entries"></ul>
    <label class="muted">Upload here: <input id="upload" type="file"></label>
  </section>
  <script>
    const state = { token: localStorage.lanlinkToken || "", share: "", path: "" };
    // crypto.randomUUID() is unavailable in some mobile browsers on local HTTP pages.
    function newClientId() {
      if (globalThis.crypto && typeof globalThis.crypto.randomUUID === "function") return globalThis.crypto.randomUUID();
      return "client-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);
    }
    const clientId = localStorage.lanlinkClientId || newClientId(); localStorage.lanlinkClientId = clientId;
    const headers = () => ({"X-LanLink-Token":state.token});
    const err = (message) => document.querySelector("#pairError").textContent = message;
    async function request(url, options={}) { const r = await fetch(url, options); if (!r.ok) throw new Error((await r.json()).detail || "Request failed"); return r; }
    async function pair() {
      const button = document.querySelector("#pairButton");
      button.disabled = true; button.textContent = "Pairing…"; err("");
      try { const r = await request("/v1/pair", {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({client_id:clientId,client_name:document.querySelector("#name").value.trim(),pair_code:document.querySelector("#code").value.trim()})}); state.token=(await r.json()).token; localStorage.lanlinkToken=state.token; await showShares(); }
      catch(e) { err(e.message + " Check that the code is current and both devices use the same Wi-Fi or hotspot."); button.disabled = false; button.textContent = "Pair and open folders"; }
    }
    async function showShares() { state.share=""; state.path=""; document.querySelector("#pair").style.display="none"; document.querySelector("#browser").style.display="block"; const data=await (await request("/v1/shares",{headers:headers()})).json(); document.querySelector("#title").textContent="Shared folders"; show(data.shares, x => openShare(x.id,x.name), true); }
    async function openShare(id,name) { state.share=id; state.path=""; await browse(name); }
    async function browse(title) { const data=await (await request(`/v1/shares/${state.share}/list?path=${encodeURIComponent(state.path)}`,{headers:headers()})).json(); document.querySelector("#title").textContent=title; show(data.entries, async x => { if(x.kind==="folder") { state.path=x.path; await browse(x.name); } else { download(x); }}); }
    function show(items, choose, isShare=false) { const list=document.querySelector("#entries"); list.innerHTML=""; items.forEach(item => { const li=document.createElement("li"), label=document.createElement("span"), b=document.createElement("button"); label.className="name"; label.textContent=(isShare?"📁 ":item.kind==="folder"?"📁 ":"📄 ")+item.name; b.textContent=isShare||item.kind==="folder"?"Open":"Download"; b.onclick=()=>choose(item); li.append(label,b); list.append(li); }); }
    async function download(file) { const response=await request(`/v1/files/${state.share}?path=${encodeURIComponent(file.path)}`,{headers:headers()}); const url=URL.createObjectURL(await response.blob()), a=document.createElement("a"); a.href=url;a.download=file.name;a.click();URL.revokeObjectURL(url); }
    document.querySelector("#pairButton").onclick=pair;
    document.querySelector("#back").onclick=async()=> { if (!state.share) return; if (!state.path) return showShares(); state.path=state.path.split("/").slice(0,-1).join("/"); await browse("Folder"); };
    document.querySelector("#upload").onchange=async(e)=> { const file=e.target.files[0]; if(!file) return; const body=new FormData();body.append("file",file); await request(`/v1/uploads/${state.share}?path=${encodeURIComponent(state.path)}`,{method:"POST",headers:headers(),body}); e.target.value=""; await browse("Folder"); };
    if(state.token) showShares().catch(()=>{
      localStorage.removeItem("lanlinkToken"); state.token="";
      document.querySelector("#pair").style.display="block";
      document.querySelector("#browser").style.display="none";
      err("Your previous pairing has expired. Enter the new code from the computer.");
    });
  </script>
</body>
</html>
