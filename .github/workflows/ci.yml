name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # PySide6 needs an X server on Linux even to build a window offscreen.
      - name: Install Qt's Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: Install LanLink
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # Ships the Kotlin compiler, so the Android protocol core is built and
      # its interop suite runs against a real node. Without it those tests skip.
      - name: Install the Kotlin toolchain
        run: python -m pip install kotlin-jupyter-kernel

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: ruff
        run: python -m ruff check .

      - name: mypy
        run: python -m mypy

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: The generated files are still in step with the code
        run: |
          python tools/export_openapi.py --check
          python tools/sync_version.py --check
